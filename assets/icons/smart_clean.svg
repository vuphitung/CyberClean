  <line x1="19" y1="25" x2="19" y2="37" stroke="#00e5ff" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
  <line x1="24" y1="25" x2="24" y2="37" stroke="#00e5ff" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
  <line x1="29" y1="25" x2="29" y2="37" stroke="#00e5ff" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
</svg>
