<svg width="128" height="128" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Trash bin body -->
  <rect x="11" y="20" width="26" height="22" rx="3" fill="#00e5ff12" stroke="#00e5ff" stroke-width="1.6"/>
  <!-- Lid -->
  <rect x="8"  y="14" width="32" height="7"  rx="3" fill="#00e5ff12" stroke="#00e5ff" stroke-width="1.6"/>
