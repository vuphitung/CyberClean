<svg width="128" height="128" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- App grid: 3 app squares, one being removed -->
  <rect x="5"  y="5"  width="16" height="16" rx="3" fill="#ff3d5a14" stroke="#ff3d5a" stroke-width="1.5"/>
  <rect x="27" y="5"  width="16" height="16" rx="3" fill="#ff3d5a14" stroke="#ff3d5a" stroke-width="1.5"/>
  <rect x="5"  y="27" width="16" height="16" rx="3" fill="#ff3d5a14" stroke="#ff3d5a" stroke-width="1.5"/>
  <!-- 4th app: fading out / being uninstalled -->
  <rect x="27" y="27" width="16" height="16" rx="3" fill="#ff3d5a08" stroke="#ff3d5a" stroke-width="1.5" stroke-dasharray="3 2" opacity=".5"/>
  <!-- X mark on 4th app -->
  <line x1="30" y1="30" x2="40" y2="40" stroke="#ff3d5a" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="30" x2="30" y2="40" stroke="#ff3d5a" stroke-width="2" stroke-linecap="round"/>
</svg>
