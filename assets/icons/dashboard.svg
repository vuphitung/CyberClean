<svg width="128" height="128" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 4-panel dashboard grid -->
  <!-- Top-left: bar chart -->
  <rect x="5" y="5" width="17" height="17" rx="2.5" fill="#00e5ff14" stroke="#00e5ff" stroke-width="1.4"/>
  <rect x="9"  y="15" width="3" height="4" rx="1" fill="#00e5ff" opacity=".5"/>
  <rect x="13" y="12" width="3" height="7" rx="1" fill="#00e5ff" opacity=".75"/>
  <rect x="17" y="9"  width="3" height="10" rx="1" fill="#00e5ff"/>

  <!-- Top-right: CPU % ring placeholder -->
  <rect x="26" y="5" width="17" height="17" rx="2.5" fill="#00e5ff14" stroke="#00e5ff" stroke-width="1.4"/>
  <circle cx="34.5" cy="13.5" r="5" stroke="#00e5ff30" stroke-width="2.5"/>
  <path d="M34.5 8.5 A5 5 0 0 1 39.5 13.5" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="34.5" cy="13.5" r="1.5" fill="#00e5ff"/>

  <!-- Bottom-left: sparkline -->
  <rect x="5" y="26" width="17" height="17" rx="2.5" fill="#00e676" fill-opacity=".08" stroke="#00e676" stroke-width="1.4"/>
  <polyline points="8,39 11,36 14,37 17,33 20,34" fill="none" stroke="#00e676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-right: disk fill bar -->
  <rect x="26" y="26" width="17" height="17" rx="2.5" fill="#ffd740" fill-opacity=".08" stroke="#ffd740" stroke-width="1.4"/>
  <rect x="29" y="34" width="11" height="3" rx="1.5" fill="#ffd74030"/>
  <rect x="29" y="34" width="7"  height="3" rx="1.5" fill="#ffd740"/>
  <rect x="29" y="29" width="11" height="3" rx="1.5" fill="#ffd74030"/>
  <rect x="29" y="29" width="9"  height="3" rx="1.5" fill="#ffd740" opacity=".6"/>
</svg>
